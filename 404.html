<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Not Found | Pratik Sonkusale</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#f6f7fb; --text:#0b1220; --muted:#4d5b72; --accent:#0369a1; --surface:#fff; --border:#e1e6ef; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#07090f; --text:#e8eef8; --muted:#9eabc2; --accent:#38bdf8; --surface:#0f1522; --border:#1c2639; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .box { max-width:560px; width:100%; border:1px solid var(--border); background:var(--surface); border-radius:16px; padding:28px; }
  h1 { font-size:clamp(48px,14vw,88px); margin:0; letter-spacing:-.04em; color:var(--accent); line-height:1; }
  p { color:var(--muted); line-height:1.7; }
  code { color:var(--text); }
  a { display:inline-block; margin-top:8px; padding:12px 18px; border-radius:10px; background:var(--text); color:var(--bg); text-decoration:none; font-weight:700; }
</style>
</head>
<body>
  <main class="box">
    <h1>404</h1>
    <p><code>HTTP/1.1 404 Not Found</code><br>The resource you requested isn't registered with this service.<br>Even the circuit breaker couldn't find a fallback for this one.</p>
    <a href="/">← Return to the portfolio</a>
  </main>
</body>
</html>
